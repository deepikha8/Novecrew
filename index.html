<!DOCTYPE html>
<html>
<head>
  <title>Student Performance Predictor - Login</title>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: url('https://cdn.corenexis.com/f/KUg5Ql4F4gH.jpg') no-repeat center center fixed;
      background-size: cover; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .container {
      width: 400px; padding: 30px; border-radius: 20px;
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4); text-align: center;
    }
    h2 { color: #fff; margin-bottom: 20px; font-weight: bold; }
    input {
      width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 10px;
      background: rgba(255,255,255,0.8);
    }
    button {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #0078D7, #005fa3);
      color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold;
      margin-top: 10px;
    }
    .toggle { margin-top: 15px; font-size: 14px; color: #fff; }
    .toggle span { color: #FFD700; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="formTitle">Login</h2>
    <form id="authForm">
      <input type="text" id="name" placeholder="Name" required>
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="button" onclick="submitForm()">Login</button>
    </form>
    <div class="toggle">
      Don’t have an account? <span onclick="toggleForm()">Register</span>
    </div>
  </div>

  <script>
    let isLogin = true;

    function toggleForm() {
      const formTitle = document.getElementById("formTitle");
      const authForm = document.getElementById("authForm");
      const toggleText = document.querySelector(".toggle");

      if (isLogin) {
        formTitle.innerText = "Register";
        authForm.innerHTML = `
          <input type="text" id="name" placeholder="Name" required>
          <input type="text" id="username" placeholder="Username" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="button" onclick="submitForm()">Register</button>
        `;
        toggleText.innerHTML = `Already have an account? <span onclick="toggleForm()">Login</span>`;
        isLogin = false;
      } else {
        formTitle.innerText = "Login";
        authForm.innerHTML = `
          <input type="text" id="name" placeholder="Name" required>
          <input type="text" id="username" placeholder="Username" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="button" onclick="submitForm()">Login</button>
        `;
        toggleText.innerHTML = `Don’t have an account? <span onclick="toggleForm()">Register</span>`;
        isLogin = true;
      }
    }

    function submitForm() {
      const name = document.getElementById("name").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (isLogin) {
        const savedUser = localStorage.getItem("username");
        const savedPass = localStorage.getItem("password");
        const savedName = localStorage.getItem("name");

        if (username === savedUser && password === savedPass && name === savedName) {
          alert("Login successful! Redirecting...");
          window.location.href = "profile.html";   // ✅ Link to profile page
        } else {
          alert("Invalid credentials. Please register first.");
        }
      } else {
        const email = document.getElementById("email").value;
        localStorage.setItem("name", name);
        localStorage.setItem("username", username);
        localStorage.setItem("password", password);
        localStorage.setItem("email", email);
        alert("Registration successful! Please login.");
        toggleForm();
      }
    }
  </script>
</body>
</html>
