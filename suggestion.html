<!DOCTYPE html>
<html>
<head>
  <title>Detailed Suggestions</title>
  <style>
    body {
      margin: 0; 
      padding: 0; 
      font-family: 'Poppins', sans-serif;
      background: url('https://img.magnific.com/premium-photo/university-campuses-education-learning-with-nice-background_1304645-20530.jpg') 
                  no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: center;
    }
    .container {
      max-width: 750px; 
      width: 95%;
      background: rgba(20, 20, 20, 0.6);
      padding: 30px; 
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h2 { 
      margin-bottom: 20px; 
      color: #FFD700; 
      font-weight: bold; 
    }
    table {
      margin-top: 20px; 
      width: 100%; 
      border-collapse: collapse;
      border-radius: 10px; 
      overflow: hidden;
    }
    th {
      padding: 12px; 
      background: #222; 
      color: #FFD700; 
      text-align: center;
    }
    td {
      padding: 15px;
      border: 1px solid #444;
      text-align: center;
      vertical-align: middle;
      background-color: #111;
      color: #FFD700;
      font-weight: bold;
    }
    tr:nth-child(even) td { background-color: #1a1a1a; }
    tr:hover td { background-color: #333; color: #fff; }
    .btn {
      margin-top: 20px; 
      padding: 12px 20px;
      background: linear-gradient(135deg, #444, #222);
      color: #FFD700; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer;
      font-size: 14px; 
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #FFD700; 
      color: #000;
      box-shadow: 0 0 10px #FFD700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Detailed Suggestions</h2>
    <div id="tableArea"></div>
    <button class="btn" onclick="goBack()">⬅ Back to Predictor</button>
    <button class="btn" onclick="logout()">🚪 Logout</button>
  </div>

  <script>
    let marks = JSON.parse(localStorage.getItem("marks")) || [];
    let subjects = [
      "Attendance","Assignment","Internal",
      "Study Hours","Previous Semester","Submission","Participation"
    ];

    let tableHTML = "<table><tr><th>Subject</th><th>Marks</th><th>Motivational Tip</th></tr>";

    subjects.forEach((subject, i) => {
      let tip = "✅ Great job! Keep it up.";
      if (i === 3 && marks[i] < 50) tip = "📚 Increase study hours: wake up at 5 AM, sleep by 10 PM, avoid mobile distractions.";
      if (i === 0 && marks[i] < 75) tip = "🏫 Improve attendance: attend classes regularly, avoid unnecessary absences.";
      if (i === 1 && marks[i] < 60) tip = "📝 Work on assignments: practice writing daily, submit on time.";
      if (i === 2 && marks[i] < 60) tip = "📖 Revise internal topics: focus on past exam papers, clarify doubts with teachers.";
      if (i === 4 && marks[i] < 60) tip = "📊 Learn from previous semester: identify weak subjects and strengthen basics.";
      if (i === 5 && marks[i] < 70) tip = "📂 Submit assignments on time: plan deadlines, avoid last-minute rush.";
      if (i === 6 && marks[i] < 50) tip = "🎤 Increase participation: engage in discussions, ask questions, join group activities.";
      
      tableHTML += "<tr><td>" + subject + "</td><td>" + (marks[i] || "N/A") + "</td><td>" + tip + "</td></tr>";
    });

    tableHTML += "</table>";
    document.getElementById("tableArea").innerHTML = tableHTML;

    function goBack() {
      window.location.href = "predictor.html";
    }
    function logout() {
      localStorage.clear(); // clear stored marks/session
      window.location.href = "logout.html"; // redirect to thank you page
    }
  </script>
</body>
</html>
