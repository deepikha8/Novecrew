<!DOCTYPE html>
<html>
<head>
  <title>Logout</title>
  <style>
    body {
      margin: 0; 
      padding: 0; 
      font-family: 'Poppins', sans-serif;
      background: url('https://img.magnific.com/premium-photo/university-campuses-education-learning-with-nice-background_1304645-20530.jpg') 
                  no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: center;
    }
    .logout-container {
      background: rgba(20, 20, 20, 0.7);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    .btn {
      padding: 12px 25px;
      background: linear-gradient(135deg, #444, #222);
      color: #FFD700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #FFD700;
      color: #000;
      box-shadow: 0 0 10px #FFD700;
    }
  </style>
</head>
<body>
  <div class="logout-container">
    <h1>Thank You!</h1>
    <p>You have successfully logged out. We appreciate your time and effort — keep striving for success!</p>
    <button class="btn" onclick="goHome()">🏠 Back to Home</button>
  </div>

  <script>
    function goHome() {
      window.location.href = "home.html"; // redirect to your home/login page
    }
  </script>
</body>
</html>
