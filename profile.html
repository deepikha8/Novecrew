<!DOCTYPE html>
<html>
<head>
  <title>Student Performance Predictor - Profile</title>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: url('https://cdn.corenexis.com/f/KUg5Ql4F4gH.jpg') no-repeat center center fixed;
      background-size: cover; height: 100vh;
      color: #fff;
      display: flex; justify-content: center; align-items: center;
    }
    .profile-container {
      width: 600px; padding: 40px;
      background: rgba(0,0,0,0.6); border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    h2 { margin-bottom: 20px; }
    .profile-item { margin: 10px 0; font-size: 18px; }
    .progress {
      display: flex; justify-content: space-around; margin: 30px 0;
    }
    .progress div {
      flex: 1; text-align: center; padding: 10px;
      border-bottom: 3px solid #ccc; color: #ccc;
      transition: all 0.3s ease;
    }
    .progress .active {
      border-color: #FFD700; color: #FFD700; font-weight: bold;
    }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.5s ease-in; }
    button {
      margin: 10px; padding: 10px 20px;
      background: linear-gradient(135deg, #0078D7, #005fa3);
      color: white; border: none; border-radius: 8px; cursor: pointer;
      font-size: 15px; font-weight: bold;
    }
    button:hover { transform: scale(1.05); }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  </style>
</head>
<body>
  <div class="profile-container">
    <h2>Complete Profile</h2>

    <!-- Auto-filled info -->
    <div class="profile-item"><strong>Name:</strong> <span id="profileName"></span></div>
    <div class="profile-item"><strong>Username:</strong> <span id="profileUsername"></span></div>
    <div class="profile-item"><strong>Email:</strong> <span id="profileEmail"></span></div>

    <!-- Progress bar -->
    <div class="progress">
      <div id="step1Indicator" class="active">1</div>
      <div id="step2Indicator">2</div>
      <div id="step3Indicator">3</div>
    </div>

    <!-- Step 1 -->
    <div id="step1" class="step active">
      <p>Step 1: Review your profile info.</p>
      <button onclick="nextStep(2)">Next</button>
      <button onclick="skipStep(2)">Skip</button>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="step">
      <p>Step 2: Confirm your details.</p>
      <button onclick="nextStep(3)">Next</button>
      <button onclick="skipStep(3)">Skip</button>
    </div>

    <!-- Step 3 -->
    <div id="step3" class="step">
      <p>Step 3: Ready to continue.</p>
      <button onclick="finishProfile()">Finish</button>
      <button onclick="skipStep('finish')">Skip</button>
    </div>
  </div>

  <script>
    // Autofill from localStorage
    document.getElementById("profileName").innerText = localStorage.getItem("name") || "Not set";
    document.getElementById("profileUsername").innerText = localStorage.getItem("username") || "Not set";
    document.getElementById("profileEmail").innerText = localStorage.getItem("email") || "Not set";

    function nextStep(step) { showStep(step); }
    function skipStep(step) { showStep(step); }

    function showStep(step) {
      document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".progress div").forEach(p => p.classList.remove("active"));

      if(step === 'finish') {
        finishProfile();
        return;
      }
      document.getElementById("step" + step).classList.add("active");
      document.getElementById("step" + step + "Indicator").classList.add("active");
    }

    function finishProfile() {
      // ✅ No alert, just redirect
      window.location.href = "predictor.html";
    }
  </script>
</body>
</html>
