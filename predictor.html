<!DOCTYPE html>
<html>
<head>
  <title>Student Performance Predictor</title>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: url('https://img.magnific.com/premium-photo/weather-forecast-symbols-green-background_1111209-8138.jpg?w=1060') no-repeat center center fixed;
      background-size: cover; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      animation: fadeIn 2s ease-in;
    }
    .container {
      max-width: 600px; width: 90%;
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
      padding: 30px; border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      text-align: center; animation: slideUp 1.5s ease-out;
    }
    h2 { margin-bottom: 10px; color: #fff; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    #welcome { color: #FFD700; font-size: 18px; margin-bottom: 20px; }
    input {
      width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 10px;
      background: rgba(255,255,255,0.8); font-size: 14px; transition: box-shadow 0.3s ease;
    }
    input:focus { box-shadow: 0 0 10px #0078D7; outline: none; }
    button {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #0078D7, #005fa3);
      color: white; border: none; border-radius: 10px; cursor: pointer;
      font-size: 16px; font-weight: bold; margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    button:hover { transform: scale(1.05); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
    #result { margin-top: 20px; font-weight: bold; text-align: center; color: #fff; font-size: 16px; animation: fadeIn 1.5s ease-in; }
    #suggestionBox { display: none; margin-top: 20px; font-size: 16px; font-weight: bold; color: #FFD700; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    @keyframes slideUp { from {transform:translateY(50px);opacity:0;} to {transform:translateY(0);opacity:1;} }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Performance Predictor</h2>
    <p id="welcome"></p>
    <form id="studentForm">
      <input type="number" id="attendance" placeholder="Attendance %" min="0" max="100" required>
      <input type="number" id="assignment" placeholder="Assignment Score" min="0" max="100" required>
      <input type="number" id="internal" placeholder="Internal Mark" min="0" max="100" required>
      <input type="number" id="studyHours" placeholder="Study Hours" min="0" max="100" required>
      <input type="number" id="prevSem" placeholder="Previous Semester Mark" min="0" max="100" required>
      <input type="number" id="submission" placeholder="Assignment Submission %" min="0" max="100" required>
      <input type="number" id="participation" placeholder="Participation %" min="0" max="100" required>
      <button type="button" onclick="predictPerformance()">Predict</button>
    </form>
    <div id="result"></div>
    <!-- Suggestion box hidden until prediction -->
    <div id="suggestionBox"></div>
    <!-- Nav button hidden until prediction -->
    <button id="navBtn" type="button" onclick="goToSuggestion()" style="display:none;">View Detailed Suggestions</button>
  </div>

  <script>
    // Show logged-in student name
    const username = localStorage.getItem("username");
    if (username) {
      document.getElementById("welcome").innerText = "Welcome, " + username + "!";
    }

    function predictPerformance() {
      // Collect values
      let attendance = document.getElementById("attendance").value;
      let assignment = document.getElementById("assignment").value;
      let internal = document.getElementById("internal").value;
      let studyHours = document.getElementById("studyHours").value;
      let prevSem = document.getElementById("prevSem").value;
      let submission = document.getElementById("submission").value;
      let participation = document.getElementById("participation").value;

      if (!attendance || !assignment || !internal || !studyHours || !prevSem || !submission || !participation) {
        document.getElementById("result").innerHTML = "⚠️ Please fill all fields.";
        return;
      }

      // Convert to numbers
      attendance = parseInt(attendance);
      assignment = parseInt(assignment);
      internal = parseInt(internal);
      studyHours = parseInt(studyHours);
      prevSem = parseInt(prevSem);
      submission = parseInt(submission);
      participation = parseInt(participation);

      const inputs = [attendance, assignment, internal, studyHours, prevSem, submission, participation];
      for (let val of inputs) {
        if (val < 0 || val > 100) {
          document.getElementById("result").innerHTML = "⚠️ All values must be between 0 and 100.";
          return;
        }
      }

      // Calculate score
      let score = (attendance*0.2 + assignment*0.2 + internal*0.2 +
                   studyHours*5 + prevSem*0.2 + submission*0.1 + participation*0.1) / 7;

      let performance, risk;
      if (score >= 75) {
        performance = "Good";
        risk = "Low";
      } else if (score >= 50) {
        performance = "Average";
        risk = "Medium";
      } else {
        performance = "Poor";
        risk = "High";
      }

      document.getElementById("result").innerHTML =
        "Predicted Score: " + score.toFixed(2) + "<br>" +
        "Performance: " + performance + "<br>" +
        "Risk Level: " + risk;

      // Show suggestion box only now
      let suggestionText = "";
      if (risk === "Low") {
        suggestionText = "Keep it up! Continue your good work and aim for improvement in weaker areas.";
      } else if (risk === "Medium" || risk === "High") {
        let minScore = Math.min(...inputs);
        let weakSubjects = [];
        inputs.forEach((val, i) => {
          if (val === minScore) weakSubjects.push(["Attendance","Assignment","Internal","Study Hours","Previous Semester","Submission","Participation"][i]);
        });
        suggestionText = "Risk is " + risk + ". Focus on improving: " + weakSubjects.join(", ");
      }
      document.getElementById("suggestionBox").innerText = suggestionText;
      document.getElementById("suggestionBox").style.display = "block";

      // Save marks for suggestion page
      localStorage.setItem("marks", JSON.stringify(inputs));

      // Show nav button
      document.getElementById("navBtn").style.display = "block";
    }

    function goToSuggestion() {
      window.location.href = "suggestion.html";
    }
  </script>
</body>
</html>
